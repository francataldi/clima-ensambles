name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "ruff>=0.15"
      - run: ruff check .

  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: torch CPU
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: dependencias
        run: python -m pip install -r requirements.txt
      - run: python -m pip list
      - run: python -m pytest -q -ra

  visor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: torch CPU
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: dependencias
        run: python -m pip install -r requirements.txt playwright
      - name: chromium
        run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -ra tests/test_viewer.py
