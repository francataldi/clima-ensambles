[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clima-ensambles"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "torch>=2.2",
    "xarray>=2024.1",
    "zarr>=2.16",
    "gcsfs>=2024.2",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.15"]

[tool.setuptools.packages.find]
include = ["clima*"]

[tool.setuptools.package-data]
clima = ["coastlines.json", "viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.pyflakes]
allowed-unused-imports = ["_path"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["clima.ensemble.EnsembleConfig", "clima.models.afno.AFNOConfig", "torch.device"]
